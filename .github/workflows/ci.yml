          - src/tests/invariants.test.ts
          - src/tests/golden-fixture.test.ts
          - src/tests/person-a-validation.test.ts
          - src/tests/person-a-evaluation.test.ts
          - src/tests/person-a-epistemic.test.ts
          - src/tests/openai-responses.test.ts
          - src/tests/clarification-question-generator.test.ts
          - src/tests/clarification-round-simulation.test.ts
          - src/tests/person-a-record-repair.test.ts
          - src/tests/person-a-cli.test.ts
          - src/tests/person-a-runtime-orchestrator.test.ts
          - src/tests/person-a-runtime-assessment-provider.test.ts
          - src/tests/person-a-clarification-answer-application.test.ts
          - src/tests/person-a-record-confirmation.test.ts
          - src/tests/person-a-challenge-resolution.test.ts
          - src/tests/person-a-extraction-acceptance.test.ts
          - src/tests/person-a-live-evaluation-contract.test.ts
          - src/tests/person-a-field-semantics.test.ts
          - src/tests/person-a-cl-a-003-recall.test.ts
          - src/tests/person-a-completion-state-compatibility.test.ts
          - src/tests/person-a-deterministic-claim-type-projection.test.ts
          - src/tests/person-a-timeline-source-containment.test.ts
          - src/tests/person-a-cl-a-013-recall.test.ts
          - src/tests/person-a-provenance.test.ts
          - src/tests/person-a-monetary-identity-compatibility.test.ts
          - src/tests/person-a-dr002-critical-diagnostic.test.ts
          - src/tests/person-a-dr002-agreement-term-decomposition.test.ts
          - src/tests/person-a-dr002-claim-no-refund-diagnostic.test.ts
          - src/tests/person-a-dr002-claim-remedy-decomposition.test.ts
          - src/tests/v2-formation-adjudication-contract.test.ts
          - src/tests/v2-1-domain-invariants.test.ts
          - src/tests/v2-1-1-external-relay-submission.test.ts
          - src/tests/v2-1-1-webmcp-application.test.ts
          - src/tests/intent-assurance.test.ts
          - src/tests/v2-1-1-party-review.test.ts
          - src/tests/v2-1-2-disclosure-review-closure.test.ts
          - src/tests/v2-1-2-party-review.test.ts
          - src/tests/v2-1-2-production-activation.test.ts
          - src/tests/v2-1-2-production-server.test.ts
          - src/tests/v2-1-3-explicit-absence.test.ts
          - src/tests/v2-1-3-disclosure-review-closure.test.ts
          - src/tests/v2-1-3-party-review.test.ts
          - src/tests/v2-1-3-production-routing.test.ts
          - src/tests/v2-1-3-zero-effect-submit.test.ts
          - src/tests/v2-1-4-explicit-absence.test.ts
          - src/tests/v2-1-4-disclosure-review-closure.test.ts
          - src/tests/v2-1-4-party-review.test.ts
          - src/tests/v2-1-4-production-routing.test.ts
          - src/tests/v2-1-4-zero-effect-submit.test.ts
          - src/tests/v2-1-4-performance-formation.test.ts
