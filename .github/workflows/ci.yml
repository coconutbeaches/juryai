    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run test file
        run: npx --no-install vitest run "${{ matrix.test_file }}"

  persistent-integration:
    name: Persistent test ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - src/tests/webmcp-persistence.test.ts
          - src/tests/v2-1-persistence.test.ts
          - src/tests/v2-1-invitation-persistence.test.ts
          - src/tests/v2-1-1-persistence.test.ts
          - src/tests/v2-1-1-invitation-persistence.test.ts
          - src/tests/v2-1-1-party-review-persistence.test.ts
          - src/tests/v2-1-2-disclosure-review-persistence.test.ts
          - src/tests/v2-1-2-production-persistence.test.ts
          - src/tests/v2-1-3-production-persistence.test.ts
          - src/tests/v2-1-4-production-persistence.test.ts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: juryai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d juryai_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      JURYAI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/juryai_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Create isolated Supabase API roles
        run: |
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          SQL
      - name: Apply isolated P2 migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260830081816_p2_persistent_repositories.sql
      - name: Apply isolated Step 63.5 web migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260831133000_p2_authenticated_web_shell.sql
      - name: Apply isolated Step 64 render challenge migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260831160000_p2_render_challenges.sql
      - name: Apply isolated dark V2.1 persistence migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260902043820_v21_dark_formation_persistence.sql
      - name: Apply isolated V2.1 invitation migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260902054913_v21_formation_invitations.sql
      - name: Apply guarded V2.1.1 external-relay migration
        if: startsWith(matrix.test_file, 'src/tests/v2-1-1-') || startsWith(matrix.test_file, 'src/tests/v2-1-2-') || startsWith(matrix.test_file, 'src/tests/v2-1-3-') || startsWith(matrix.test_file, 'src/tests/v2-1-4-')
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260902091449_v211_external_relay_submission.sql
      - name: Apply private V2.1.1 party-review assurance migration
        if: matrix.test_file == 'src/tests/v2-1-1-party-review-persistence.test.ts' || startsWith(matrix.test_file, 'src/tests/v2-1-2-') || startsWith(matrix.test_file, 'src/tests/v2-1-3-') || startsWith(matrix.test_file, 'src/tests/v2-1-4-')
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260903022149_v211_party_review_intent_assurance.sql
      - name: Apply V2.1.2 disclosure-review closure migration
        if: startsWith(matrix.test_file, 'src/tests/v2-1-1-') || startsWith(matrix.test_file, 'src/tests/v2-1-2-') || startsWith(matrix.test_file, 'src/tests/v2-1-3-') || startsWith(matrix.test_file, 'src/tests/v2-1-4-')
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260903043758_v212_disclosure_review_closure.sql
      - name: Apply additive V2.1.2 protected-action pairing migration
        if: startsWith(matrix.test_file, 'src/tests/v2-1-2-') || startsWith(matrix.test_file, 'src/tests/v2-1-3-') || startsWith(matrix.test_file, 'src/tests/v2-1-4-')
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260903074232_v212_party_review_protected_action.sql
      - name: Apply additive V2.1.3 explicit-absence contract pairs
        if: startsWith(matrix.test_file, 'src/tests/v2-1-3-') || startsWith(matrix.test_file, 'src/tests/v2-1-4-')
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260904010302_v213_explicit_absence_contract_pairs.sql
      - name: Apply additive V2.1.4 performance-formation contract pairs
        if: startsWith(matrix.test_file, 'src/tests/v2-1-4-')
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260904120000_v214_performance_formation_contract_pairs.sql
      - name: Run persistent integration test
        run: npx --no-install vitest run "${{ matrix.test_file }}"
      - name: Prove V2.1.1 migration rejects populated dark state
        if: matrix.test_file == 'src/tests/v2-1-1-persistence.test.ts'
        run: |
          if psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260902091449_v211_external_relay_submission.sql \
            >/tmp/v211-migration-guard.log 2>&1; then
            echo "V2.1.1 zero-row migration guard unexpectedly accepted populated state"
            exit 1
          fi
          grep -F "V2.1.1 refuses to reinterpret" /tmp/v211-migration-guard.log

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build frameworkless browser shell
        run: npm run build:web
      - name: Check every test file runs in the CI matrix
        run: npm run check:ci-test-coverage
      - name: Validate golden fixture
        run: npm run validate:golden
      - name: Validate frozen Gate Zero corpus
        run: npm run validate:gate-zero-corpus
      - name: Validate Gate Zero capability baseline
        run: npm run validate:gate-zero-baseline
      - name: Validate Gate Zero acceptance policy
        run: npm run validate:gate-zero-policy
      - name: Gate Person A extraction acceptance corpus
        run: npm run gate:person-a-acceptance
      - name: Run the offline semantic compiler eval
        run: npm run eval:compiler
      - name: Run additive explicit-absence replay and trap corpus
        run: npm run eval:compiler:absence
      - name: Check formatting
        run: npm run format:check
      - name: Audit dependencies
        run: npm audit --audit-level=low
