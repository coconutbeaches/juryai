          - src/tests/webmcp-http-case-service.test.ts
          - src/tests/webmcp-browser-shell.test.ts
          - src/tests/webmcp-step64-browser.test.ts
          - src/tests/webmcp-server-auth.test.ts
          - src/tests/webmcp-step64-server.test.ts
