name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Test ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - src/tests/schema.test.ts
          - src/tests/invariants.test.ts
          - src/tests/golden-fixture.test.ts
          - src/tests/person-a-validation.test.ts
          - src/tests/person-a-evaluation.test.ts
          - src/tests/person-a-epistemic.test.ts
          - src/tests/openai-responses.test.ts
          - src/tests/clarification-question-generator.test.ts
          - src/tests/clarification-round-simulation.test.ts
          - src/tests/person-a-record-repair.test.ts
          - src/tests/person-a-cli.test.ts
          - src/tests/person-a-runtime-orchestrator.test.ts
          - src/tests/person-a-runtime-assessment-provider.test.ts
          - src/tests/person-a-clarification-answer-application.test.ts
          - src/tests/person-a-record-confirmation.test.ts
          - src/tests/person-a-challenge-resolution.test.ts
          - src/tests/person-a-extraction-acceptance.test.ts
          - src/tests/person-a-live-evaluation-contract.test.ts
          - src/tests/person-a-field-semantics.test.ts
          - src/tests/person-a-cl-a-003-recall.test.ts
          - src/tests/person-a-completion-state-compatibility.test.ts
          - src/tests/person-a-deterministic-claim-type-projection.test.ts
          - src/tests/person-a-timeline-source-containment.test.ts
          - src/tests/person-a-cl-a-013-recall.test.ts
          - src/tests/person-a-provenance.test.ts
          - src/tests/person-a-monetary-identity-compatibility.test.ts
          - src/tests/person-a-dr002-critical-diagnostic.test.ts
          - src/tests/person-a-dr002-agreement-term-decomposition.test.ts
          - src/tests/person-a-dr002-claim-no-refund-diagnostic.test.ts
          - src/tests/person-a-dr002-claim-remedy-decomposition.test.ts
          - src/tests/v2-formation-adjudication-contract.test.ts
          - src/tests/gate-zero-coverage-matrix.test.ts
          - src/tests/gate-zero-initial-ten-cases.test.ts
          - src/tests/gate-zero-frozen-corpus.test.ts
          - src/tests/gate-zero-capability-baseline.test.ts
          - src/tests/gate-zero-acceptance-policy.test.ts
          - src/tests/webmcp-core.test.ts
          - src/tests/webmcp-readback.test.ts
          - src/tests/webmcp-tools.test.ts
          - src/tests/webmcp-case-service-adapter.test.ts
          - src/tests/webmcp-public-contract.test.ts
          - src/tests/webmcp-http-case-service.test.ts
          - src/tests/webmcp-browser-shell.test.ts
          - src/tests/webmcp-step64-browser.test.ts
          - src/tests/webmcp-server-auth.test.ts
          - src/tests/webmcp-step64-server.test.ts
          - src/tests/webmcp-runtime.test.ts
          - src/tests/webmcp-model-compiler.test.ts
          - src/tests/webmcp-compiler-eval.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run test file
        run: npx --no-install vitest run "${{ matrix.test_file }}"

  persistent-integration:
    name: Persistent test ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - src/tests/webmcp-persistence.test.ts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: juryai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d juryai_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      JURYAI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/juryai_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply isolated P2 migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260830081816_p2_persistent_repositories.sql
      - name: Apply isolated Step 63.5 web migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260831133000_p2_authenticated_web_shell.sql
      - name: Apply isolated Step 64 render challenge migration
        run: >-
          psql "$JURYAI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260831160000_p2_render_challenges.sql
      - name: Run persistent integration test
        run: npx --no-install vitest run "${{ matrix.test_file }}"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build frameworkless browser shell
        run: npm run build:web
      - name: Check every test file runs in the CI matrix
        run: npm run check:ci-test-coverage
      - name: Validate golden fixture
        run: npm run validate:golden
      - name: Validate frozen Gate Zero corpus
        run: npm run validate:gate-zero-corpus
      - name: Validate Gate Zero capability baseline
        run: npm run validate:gate-zero-baseline
      - name: Validate Gate Zero acceptance policy
        run: npm run validate:gate-zero-policy
      - name: Gate Person A extraction acceptance corpus
        run: npm run gate:person-a-acceptance
      - name: Run the offline semantic compiler eval
        run: npm run eval:compiler
      - name: Check formatting
        run: npm run format:check
      - name: Audit dependencies
        run: npm audit --audit-level=low
