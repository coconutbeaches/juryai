name: Temporary WebMCP formatter

on:
  push:
    branches:
      - feat/webmcp-v02-tools

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format WebMCP changes
        run: >-
          npx --no-install prettier --write
          src/webmcp/tools/*.ts
          src/tests/webmcp-tools.test.ts
          .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/webmcp/tools src/tests/webmcp-tools.test.ts .github/workflows/ci.yml
          git commit -m "style(webmcp): apply Prettier"
          git push origin HEAD:feat/webmcp-v02-tools
