<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>JuryAI</title>
  </head>
  <body>
    <main>
      <header>
        <p class="muted">Private P2 case preparation</p>
        <h1>JuryAI</h1>
      </header>

      <p id="route-notice" hidden></p>
      <p id="status" role="status" aria-live="polite"></p>

      <section id="auth-section" hidden>
        <h2>Sign in</h2>
        <p>Use the email address that was invited to JuryAI.</p>
        <form id="auth-form">
          <label>
            Email
            <input id="email" name="email" type="email" autocomplete="email" required />
          </label>
          <button id="request-code-button" class="secondary" type="button">
            Request six-digit code
          </button>
          <label>
            Verification code
            <input
              id="otp"
              name="otp"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              maxlength="6"
              required
            />
          </label>
          <button type="submit">Verify and continue</button>
        </form>
      </section>

      <section id="disclosure-section" hidden>
        <h2>Before you continue</h2>
        <p id="disclosure-copy"></p>
        <form id="disclosure-form">
          <button type="submit">I understand and accept</button>
        </form>
      </section>

      <section id="ready-section" hidden>
        <h2>Ready</h2>
        <p id="webmcp-capability"></p>
        <p>
          <a id="active-draft-link" hidden>Resume / review current draft</a>
        </p>
      </section>

      <button id="logout-button" class="secondary" type="button" hidden>Log out</button>
    </main>
    <script type="module" src="/src/webmcp/browser/entry.ts"></script>
  </body>
</html>
